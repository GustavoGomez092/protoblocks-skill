<!doctype html>
<html><head><meta charset="utf-8"><title>motion faults</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; }
  section { min-height: 600px; padding: 40px; }
  [data-pb-motion][data-proto-animate="manual"] { opacity: 0; }
  .spacer { height: 1400px; }
  .row { display: flex; gap: 16px; }
  .row > div { width: 120px; height: 80px; background: #2563eb; }
</style>
<script>window.pbMotionProfile = { duration: 0.3, ease: 'power2.out', stagger: 0.05, distance: 24 };</script>
</head><body>
  <!-- One fault per run, picked by ?fault=. Each fault breaks exactly one motion-check rule and leaves the
       rest clean, so a test can prove that rule alone fails the check.
       cls    a block above the section grows then collapses once the title reveals (motion only)
       cls-outside  same, but the block sits below the section, so only content outside the anchor shifts
       error  an uncaught exception
       stuck  an empty (invisible) reveal element whose tween is delayed 30s, so it never reports done
       hang-motion  same stalled image, but only added when motion is on, so the reduced-motion shot (shoot) sees
              nothing and only motionCheck's own settled-frame image check can catch it (anchor pb-hang)
       load-shift  a block at the top of the section grows 300ms after load in BOTH loads (motion and reduced): a
              load-time shift, not caused by motion, so the reduced-page baseline cancels it
       hang   a lazy image far down the page, in its own section #pb-hang, whose request never answers
              (outside #pb-s1: a page-wide warning; with anchor pb-hang: an anchor image error) -->
  <div id="shim"></div>
  <section id="pb-s1">
    <span id="stuck" data-pb-motion="fade-in" data-proto-animate="manual"></span>
    <h1 id="t1" data-pb-motion="fade-up" data-proto-animate="manual">Fade up title</h1>
    <h2 id="t2" data-pb-motion="split-lines" data-proto-animate="manual">Split lines heading that wraps</h2>
    <div id="row" class="row" data-pb-motion="stagger-children" data-proto-animate="manual"><div></div><div></div><div></div></div>
  </section>
  <div id="shim2"></div>
  <div id="below" style="height:200px;background:#16a34a"></div>
  <div class="spacer"></div>
  <script>
    (function () {
      var fault = new URLSearchParams(location.search).get('fault');
      var motion = !matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (fault === 'load-shift') {
        var grow = document.createElement('div'); grow.id = 'grow'; grow.style.height = '0';
        var host = document.getElementById('pb-s1'); host.insertBefore(grow, host.firstChild);
        setTimeout(function () { grow.style.height = '200px'; }, 300);
      }
      if (fault === 'stuck') document.getElementById('stuck').setAttribute('data-pb-delay', '30');
      if (fault === 'error') setTimeout(function () { throw new Error('motion-fault-boom'); }, 0);
      if (fault === 'hang' || fault === 'hang-motion') {
        var pad = document.createElement('div'); pad.style.height = '8000px'; document.body.appendChild(pad);
        var sec = document.createElement('section'); sec.id = 'pb-hang'; document.body.appendChild(sec);
        if (fault === 'hang' || motion) {
          var img = document.createElement('img'); img.loading = 'lazy'; img.width = 10; img.height = 10; img.alt = 'stalled'; img.src = '/__hang';
          sec.appendChild(img);
        }
      }
      if ((fault === 'cls' || fault === 'cls-outside') && motion) {
        document.addEventListener('proto-blocks:reveal', function (e) {
          if (e.target.id !== 't1') return;
          var shim = document.getElementById(fault === 'cls' ? 'shim' : 'shim2');
          shim.style.height = '300px';
          setTimeout(function () { shim.style.height = '0'; }, 150);
        });
      }
    })();
  </script>
  <script src="/vendor/gsap.min.js"></script>
  <script src="/vendor/ScrollTrigger.min.js"></script>
  <script src="/vendor/SplitText.min.js"></script>
  <script src="/runtime/pb-motion.js"></script>
</body></html>
