<!doctype html>
<html><head><meta charset="utf-8"><title>motion counter width</title>
<!-- #pb-s1: a counter in pb-digits.ttf (proportional digits by default, "1" narrow; tabular digits through tnum are
     wider), so tabular "1,111+" is wider than the authored proportional text; #dn sits right after it.
     #pb-s2: block-level counters in a 2-column grid; their box width comes from the grid, not the text. -->
<style>
  @font-face { font-family: PbDigits; src: url('/fonts/pb-digits.ttf') format('truetype'); }
  body { margin: 0; font-family: Arial, sans-serif; }
  section { padding: 40px; }
  [data-pb-motion][data-proto-animate="manual"] { opacity: 0; }
  .row { display: flex; gap: 20px; font: 400 72px PbDigits, Arial, sans-serif; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid > div { font: 700 48px Arial, sans-serif; background: #eef2ff; }
  .spacer { height: 1400px; }
</style>
<script>window.pbMotionProfile = { duration: 0.6, ease: 'none', stagger: 0.05, distance: 24 };</script>
</head><body>
  <div class="spacer"></div>
  <section id="pb-s1">
    <div class="row"><span id="d1" data-pb-motion="counter" data-proto-animate="manual">1,111+</span><span id="dn">N</span></div>
  </section>
  <div class="spacer"></div>
  <div class="spacer"></div>
  <section id="pb-s2">
    <div class="grid">
      <div id="g1" data-pb-motion="counter" data-proto-animate="manual">1,250+</div>
      <div id="g2" data-pb-motion="counter" data-proto-animate="manual">98%</div>
    </div>
  </section>
  <div class="spacer"></div>
  <script src="/vendor/gsap.min.js"></script>
  <script src="/vendor/ScrollTrigger.min.js"></script>
  <script src="/runtime/pb-motion.js"></script>
</body></html>
