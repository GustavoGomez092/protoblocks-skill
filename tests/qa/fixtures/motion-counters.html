<!doctype html>
<html><head><meta charset="utf-8"><title>motion counters</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; }
  section { min-height: 600px; padding: 40px; }
  [data-pb-motion][data-proto-animate="manual"] { opacity: 0; }
  /* Content-sized stats in a row: if a value's width changes while it counts, every stat after it moves. */
  .stats { display: flex; gap: 40px; align-items: flex-start; }
  .stat { flex: none; background: #eef2ff; padding: 16px; }
  .stat span { font-size: 72px; font-weight: 700; }
  .stat small { display: block; font-size: 16px; }
  .after { height: 120px; background: #2563eb; margin-top: 24px; }
</style>
<!-- bold-like duration: an uncapped counter would run 2 x 1.1 = 2.2s, past the plugin watchdog's 1.5s -->
<script>window.pbMotionProfile = { duration: 1.1, ease: 'power2.out', stagger: 0.05, distance: 24 };</script>
</head><body>
  <section id="pb-s1">
    <div class="stats">
      <div class="stat"><span id="n1" data-pb-motion="counter" data-proto-animate="manual">1,250+</span><small>clients</small></div>
      <div class="stat"><span id="n2" data-pb-motion="counter" data-proto-animate="manual">$4.9M</span><small>raised</small></div>
      <div class="stat"><span id="n3" data-pb-motion="counter" data-proto-animate="manual">98%</span><small>retention</small></div>
      <div class="stat"><span>Static</span><small>neighbour</small></div>
    </div>
    <div class="after"></div>
  </section>
  <div style="height:1400px"></div>
  <script src="/vendor/gsap.min.js"></script>
  <script src="/vendor/ScrollTrigger.min.js"></script>
  <script src="/vendor/SplitText.min.js"></script>
  <script src="/runtime/pb-motion.js"></script>
</body></html>
