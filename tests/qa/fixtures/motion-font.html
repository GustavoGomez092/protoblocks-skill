<!doctype html>
<html><head><meta charset="utf-8"><title>motion font</title>
<!-- A split-lines heading set in a web font that arrives late. pb-wide.ttf (generated, every printable glyph 1em wide,
     space 0.6em) wraps "Split lines heading that wraps" into 3 lines at 40px in 600px; Arial fits it on 1 line.
     ?font=hang  the font request never answers (the split must give up and still reveal the heading)
     ?font=fast  the font is served without delay -->
<script>
  (function () {
    var f = new URLSearchParams(location.search).get('font');
    var src = f === 'hang' ? '/__hang' : f === 'fast' ? '/fonts/pb-wide.ttf' : '/__slow/1200/fonts/pb-wide.ttf';
    document.write('<style>@font-face{font-family:PbWide;src:url(' + src + ') format("truetype");font-display:swap}</style>');
  })();
</script>
<style>
  body { margin: 0; font-family: Arial, sans-serif; }
  section { min-height: 600px; padding: 40px; }
  [data-pb-motion][data-proto-animate="manual"] { opacity: 0; }
  #t2 { font-family: PbWide, Arial, sans-serif; font-size: 40px; line-height: 50px; width: 600px; margin: 0 0 24px; font-weight: 400; }
  .after { height: 100px; background: #2563eb; }
  .spacer { height: 1400px; }
</style>
<script>window.pbMotionProfile = { duration: 0.3, ease: 'power2.out', stagger: 0.05, distance: 24 };</script>
</head><body>
  <section id="pb-s1">
    <h2 id="t2" data-pb-motion="split-lines" data-proto-animate="manual">Split lines heading that wraps</h2>
    <div class="after"></div>
  </section>
  <div class="spacer"></div>
  <script src="/vendor/gsap.min.js"></script>
  <script src="/vendor/ScrollTrigger.min.js"></script>
  <script src="/vendor/SplitText.min.js"></script>
  <script>
    // Record every split: how many lines it made and whether the web font was loaded at that moment.
    (function () {
      var S = window.SplitText;
      window.__splits = [];
      window.SplitText = function (el, cfg) {
        var s = new S(el, cfg);
        window.__splits.push({ lines: s.lines.length, font: document.fonts.check('40px PbWide') });
        return s;
      };
    })();
  </script>
  <script src="/runtime/pb-motion.js"></script>
</body></html>
